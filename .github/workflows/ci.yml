name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: fuzz
        run: |
          go test -run='^$' -fuzz='^FuzzDecodeNetInfo$' -fuzztime=30s ./internal/rpc/
          go test -run='^$' -fuzz='^FuzzDecodeStatus$'  -fuzztime=30s ./internal/rpc/
          go test -run='^$' -fuzz='^FuzzDecodeABCIInfo$' -fuzztime=30s ./internal/rpc/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11